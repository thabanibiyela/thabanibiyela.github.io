theme: jekyll-theme-minimal

nav_links:
  - title: Home
    url: /
  - title: CV
    url: /cv
  - title: Featured Project
    url: /featured
logo: data/images/profile1_small.png
title: Thabani's homepage
description: A curated collection of my work in finance automation showcasing how I use Python, SQL, JavaScript, and GCP to solve complex financial problems and build data-driven tools.

# These settings control the types of collections used by the template
collections:
  cv:
    output: true
    permalink: /:collection/:path/
  featured:
    output: true
    permalink: /:collection/:path/

# These settings control how pages and collections are included in the site
defaults:
  - scope:
      path: ""
      type: cv
    values:
      layout: default
  - scope:
      path: ""
      type: featured
    values:
      layout: default